body{margin:0;background:transparent;color:var(--ink);font:400 16px/1.55 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 20px 60px;background:rgba(14,14,14,.62);min-height:100vh}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:6px 0 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.brand img{width:92px;height:58px;border-radius:10px;object-fit:contain;background:#111;flex:none}
.brand b{display:block;font-size:clamp(22px,7vw,36px);line-height:1;font-weight:800;letter-spacing:.1em;background:linear-gradient(180deg,#fff3a6,#f2c200 55%,#b88a00);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand a.ig{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:8px 12px 8px 8px;min-height:44px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;background:rgba(0,0,0,.35)}
.brand a.ig svg{width:26px;height:26px;flex:none}
.brand a.ig:hover{border-color:var(--acc)}
.brand a.ig:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
h1{font-size:34px;line-height:1.1;margin:8px 0 6px;font-weight:800}
h2{font-size:20px;margin:36px 0 10px;font-weight:800;color:var(--acc)}
p.sub{color:var(--mute);margin:0 0 20px}
fieldset{border:0;border-left:3px solid var(--line);margin:0 0 18px;padding:0 0 0 14px;min-width:0}
legend{font-weight:600;padding:0;margin-bottom:8px;float:left;width:100%}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 3px;clear:both}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.dt{display:flex;gap:6px}.dt input{width:auto;flex:1;min-width:0;padding:10px 4px;text-align:center}.dt input:nth-child(3){flex:1.8}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button{font:600 16px inherit;font-family:inherit;border:0;border-radius:8px;padding:12px 18px;background:var(--acc);color:#1a1500;cursor:pointer}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.on{border-color:var(--acc2);color:var(--acc2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 18px}
.hero{border-left:6px solid var(--acc);padding-left:16px;margin:28px 0}
.hero .n{font-size:clamp(38px,12vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--acc)}
.hero .l{color:var(--mute);margin-top:6px}
.row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.row span{color:var(--mute)}
.note{padding:10px 0 10px 12px;border-left:3px solid var(--acc2);margin:10px 0}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item button{padding:6px 12px}
h3{font-size:17px;margin:22px 0 4px}
.hide{display:none}.ai i{font-style:normal}
</style>
</head>

<button class="alt" id="bp">💞 Sevgilim</button>
<button class="alt" id="bf">👪 Ailə</button>
</div>

<fieldset id="pp" class="hide"><legend>Sevgilim</legend>
<label for="pn">Adı</label><input id="pn" autocomplete="off">
<label>Doğum tarixi</label><div class="dt" id="pb"></div>
<label for="pc">Ölkəsi</label><select id="pc"></select>
<label>Sevgili olduğunuz gün</label><div class="dt" id="ps"></div>
</fieldset>

<fieldset id="fp" class="hide"><legend>Ailə</legend>
<div id="fl"></div>
<label for="fr">Kimdir?</label>
<select id="fr"><option>Ata</option><option>Ana</option><option>Bacı</option><option>Qardaş</option><option>Nənə</option><option>Baba</option><option>Övlad</option><option>Digər</option></select>
<label for="fn">Adı</label><input id="fn" autocomplete="off">
<label for="fc">Ölkəsi</label><select id="fc"></select>
<label>Doğum tarixi</label><div class="dt" id="fd"></div>
<p><button class="alt" id="fa">+ Əlavə et</button></p>
</fieldset>

<div class="bar"><button id="go">Hesabla</button><button class="alt" id="clr">Hamısını sil</button></div>
<div id="out" class="hide"></div>
</main>
<script>
var $=function(i){return document.getElementById(i)};
var AY=["Yanvar","Fevral","Mart","Aprel","May","İyun","İyul","Avqust","Sentyabr","Oktyabr","Noyabr","Dekabr"];
var HG=["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"];
var GUL=["qərənfil","bənövşə","nərgiz","çobanyastığı","innicçiçəyi","qızılgül","mahmızçiçəyi","qladiolus","astra","qadifəgül","xrizantema","puansettiya"];
var BURC=[["Oğlaq",19],["Dolça",18],["Balıqlar",20],["Qoç",19],["Buğa",20],["Əkizlər",20],["Xərçəng",22],["Şir",22],["Qız",22],["Tərəzi",22],["Əqrəb",21],["Oxatan",21]];
function burc(d){var m=d.getMonth();return d.getDate()<=BURC[m][1]?BURC[m][0]:BURC[(m+1)%12][0]}
function U(d){return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())}
function days(a,b){return Math.round((U(b)-U(a))/864e5)}
function add(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,12)}
function fmt(d){return d.getDate()+" "+AY[d.getMonth()]+" "+d.getFullYear()+", "+HG[d.getDay()]}
function ymd(a,b){var y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();
if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}return [y,m,d]}
function nextOcc(d,t){var x=new Date(t.getFullYear(),d.getMonth(),d.getDate(),12);if(days(t,x)<0)x=new Date(t.getFullYear()+1,d.getMonth(),d.getDate(),12);return x}
function nf(n){return Math.abs(n).toLocaleString("ru-RU").replace(/\u00a0/g," ")}
function row(a,b){return '<div class="row"><span>'+a+'</span><b>'+b+'</b></div>'}
function note(t){return '<div class="note">'+t+'</div>'}
function when(d,t){var n=days(t,d);return n===0?"bu gün! 🎉":n+" gün qalıb ("+fmt(d)+")"}
function ageTxt(a,t){var r=ymd(a,t);return r[0]+" il, "+r[1]+" ay, "+r[2]+" gün"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function iso(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function P(s){var a=s.split("-");return new Date(+a[0],+a[1]-1,+a[2],12)}

/* rəqəmlə tarix sahələri */
var PH=[["Gün",2],["Ay",2],["İl",4]];
function initDate(id){var box=$(id);PH.forEach(function(p,i){var e=document.createElement("input");e.inputMode="numeric";e.placeholder=p[0];e.maxLength=p[1];e.setAttribute("aria-label",p[0]);
e.oninput=function(){e.value=e.value.replace(/\D/g,"");var n=box.children[i+1];
if(i<2&&(e.value.length>=p[1]||(e.value.length===1&&+e.value>(i?1:3)))&&n)n.focus()};
e.onkeydown=function(k){if(k.key==="Backspace"&&!e.value&&i>0)box.children[i-1].focus()};box.appendChild(e)})}
function rd(id){var c=$(id).children,d=+c[0].value,m=+c[1].value,y=+c[2].value;
if(!d||!m||y<1900)return null;var x=new Date(y,m-1,d,12);return(x.getDate()===d&&x.getMonth()===m-1)?x:null}
function setD(id,s){var c=$(id).children;if(!s){for(var i=0;i<3;i++)c[i].value="";return}var a=s.split("-");c[0].value=a[2];c[1].value=a[1];c[2].value=a[0]}
["bd","pb","ps","fd"].forEach(initDate);

var ZOD=["Siçan 🐭","Öküz 🐂","Pələng 🐯","Dovşan 🐇","Əjdaha 🐉","İlan 🐍","At 🐴","Keçi 🐐","Meymun 🐵","Xoruz 🐓","İt 🐕","Donuz 🐖"];
var HIT="Goodnight Irene – Weavers|Cinderella;Too Young – Nat King Cole|Quo Vadis;Cry – Johnnie Ray|The Greatest Show on Earth;Song from Moulin Rouge – Percy Faith|The Robe;Little Things Mean a Lot – Kitty Kallen|White Christmas;Rock Around the Clock – Bill Haley|Lady and the Tramp;Hound Dog – Elvis Presley|The Ten Commandments;All Shook Up – Elvis Presley|The Bridge on the River Kwai;Volare – Domenico Modugno|South Pacific;The Battle of New Orleans – Johnny Horton|Ben-Hur;The Twist – Chubby Checker|Psycho;Tossin and Turnin – Bobby Lewis|101 Dalmatians;Stranger on the Shore – Acker Bilk|How the West Was Won;Sugar Shack – Jimmy Gilmer|Cleopatra;I Want to Hold Your Hand – The Beatles|Mary Poppins;Wooly Bully – Sam the Sham|The Sound of Music;Ballad of the Green Berets – Barry Sadler|Hawaii;To Sir With Love – Lulu|The Jungle Book;Hey Jude – The Beatles|2001: A Space Odyssey;Sugar, Sugar – The Archies|Butch Cassidy and the Sundance Kid;Bridge over Troubled Water – Simon and Garfunkel|Love Story;Joy to the World – Three Dog Night|Fiddler on the Roof;The First Time Ever I Saw Your Face – Roberta Flack|The Godfather;Tie a Yellow Ribbon – Dawn|The Exorcist;The Way We Were – Barbra Streisand|Blazing Saddles;Love Will Keep Us Together – Captain and Tennille|Jaws;Silly Love Songs – Wings|Rocky;You Light Up My Life – Debby Boone|Star Wars;Shadow Dancing – Andy Gibb|Grease;My Sharona – The Knack|Kramer vs. Kramer;Call Me – Blondie|The Empire Strikes Back;Bette Davis Eyes – Kim Carnes|Raiders of the Lost Ark;Physical – Olivia Newton-John|E.T.;Every Breath You Take – The Police|Return of the Jedi;When Doves Cry – Prince|Beverly Hills Cop;Careless Whisper – Wham!|Back to the Future;That's What Friends Are For – Dionne and Friends|Top Gun;Walk Like an Egyptian – The Bangles|Three Men and a Baby;Faith – George Michael|Rain Man;Look Away – Chicago|Batman;Hold On – Wilson Phillips|Home Alone;(Everything I Do) I Do It for You – Bryan Adams|Terminator 2;End of the Road – Boyz II Men|Aladdin;I Will Always Love You – Whitney Houston|Jurassic Park;The Sign – Ace of Base|The Lion King;Gangsta's Paradise – Coolio|Toy Story;Macarena – Los del Río|Independence Day;Candle in the Wind 1997 – Elton John|Titanic;Too Close – Next|Saving Private Ryan;Believe – Cher|Star Wars: The Phantom Menace;Maria Maria – Santana|How the Grinch Stole Christmas;Hanging by a Moment – Lifehouse|Harry Potter and the Sorcerer's Stone;How You Remind Me – Nickelback|Spider-Man;In da Club – 50 Cent|Finding Nemo;Yeah! – Usher|Shrek 2;We Belong Together – Mariah Carey|Star Wars: Revenge of the Sith;Bad Day – Daniel Powter|Pirates of the Caribbean: Dead Man's Chest;Irreplaceable – Beyoncé|Spider-Man 3;Low – Flo Rida|The Dark Knight;Boom Boom Pow – Black Eyed Peas|Avatar;Tik Tok – Kesha|Toy Story 3;Rolling in the Deep – Adele|Harry Potter and the Deathly Hallows Part 2;Somebody That I Used to Know – Gotye|The Avengers;Thrift Shop – Macklemore|Iron Man 3;Happy – Pharrell Williams|Guardians of the Galaxy;Uptown Funk – Mark Ronson ft. Bruno Mars|Star Wars: The Force Awakens;Love Yourself – Justin Bieber|Rogue One;Shape of You – Ed Sheeran|Star Wars: The Last Jedi;God's Plan – Drake|Black Panther;Old Town Road – Lil Nas X|Avengers: Endgame;Blinding Lights – The Weeknd|Bad Boys for Life;Levitating – Dua Lipa|Spider-Man: No Way Home;Heat Waves – Glass Animals|Top Gun: Maverick;Flowers – Miley Cyrus|Barbie;Lose Control – Teddy Swims|Inside Out 2".split(";");
var CNY=[130,217,206,126,214,204,124,211,131,219,208,127,215,204,125,213,201,122,210,129,217,206,127,214,203,124,212,131,218,208,128,215,205,125,213,202,121,209,130,217,206,127,215,203,123,211,131,218,207,128,216,205,125,213,202,220,209,129,217,206,127,215,204,123,210,131,219,207,128,216,205,124,212,201,122,209,129,218,207,126,214,203,123,210,131,219,208,128,216,205,125,212,201,122,210,129,217,206,126,213,203];
function animal(d){var y=d.getFullYear(),md=(d.getMonth()+1)*100+d.getDate(),c=CNY[y-1930];if(c&&md<c)y--;return ZOD[(y-4)%12]}
function cur(c,y){var r={
az:[[1991,"Sovet rublu"],[2005,"manat (köhnə, AZM)"],[9999,"manat (AZN)"]],
tr:[[2004,"Türk lirası (köhnə, TRL)"],[2008,"Yeni Türk lirası (YTL)"],[9999,"Türk lirası (TRY)"]],
ru:[[1991,"Sovet rublu"],[1997,"rubl (köhnə)"],[9999,"rubl (RUB)"]],
ge:[[1992,"Sovet rublu"],[1994,"kupon"],[9999,"lari (GEL)"]],
ua:[[1991,"Sovet rublu"],[1995,"kupon-karbovanes"],[9999,"qrivna (UAH)"]],
kz:[[1992,"Sovet rublu"],[9999,"tenge (KZT)"]],
ir:[[9999,"rial (IRR)"]],us:[[9999,"ABŞ dolları (USD)"]],
de:[[1998,"Alman markası (DM)"],[2001,"marka (avroya keçid dövrü)"],[9999,"avro (EUR)"]],
gb:[[1970,"funt sterlinq (şillinq-pens sistemi)"],[9999,"funt sterlinq (GBP)"]]}[c]||[];
for(var i=0;i<r.length;i++)if(y<=r[i][0])return r[i][1];return "-"}
var LOC={
az:{f:[[1945,"Arşın mal alan"],[1942,"Bəxtiyar"],[1982,"Nizami"],[1956,"O olmasın, bu olsun"],[1962,"Telefonçu qız"],[1969,"Qanun naminə"],[1970,"Yeddi oğul istərəm"],[1973,"Əhməd haradadır?"],[1975,"Dədə Qorqud"]],
s:[[2008,"Day After Day – Elnur və Samir"],[2009,"Always – AySel və Arash"],[2011,"Running Scared – Ell və Nikki"],[2013,"Hold Me – Fərid Məmmədov"]]},
tr:{f:[[1969,"Bir Türk'e Gönül Verdim"],[1975,"Hababam Sınıfı"],[1976,"Tosun Paşa"],[1977,"Selvi Boylum Al Yazmalım"],[1982,"Yol"],[1996,"Eşkıya"],[2001,"Vizontele"],[2005,"Babam ve Oğlum"],[2008,"Recep İvedik"]],
s:[[1981,"Dönence – Barış Manço"],[1991,"Firuze – Sezen Aksu"],[1997,"Şımarık – Tarkan"],[2001,"Kuzu Kuzu – Tarkan"],[2003,"Everyway That I Can – Sertab Erener"]]},
ru:{f:[[1966,"Кавказская пленница"],[1969,"Бриллиантовая рука"],[1973,"Иван Васильевич меняет профессию"],[1975,"Ирония судьбы"],[1980,"Москва слезам не верит"],[1997,"Брат"]],
s:[[1955,"Подмосковные вечера"],[1983,"Миллион алых роз – Алла Пугачёва"],[1988,"Группа крови – Кино"]]}};
function yb(d,c,t){var y=d.getFullYear(),L=LOC[c],hf=HIT[y-1950],fm="",fs="",s="",p;
if(L){L.f.forEach(function(x){if(x[0]===y)fm=x[1]});L.s.forEach(function(x){if(x[0]===y)fs=x[1]})}
s+=row("Bu gün neçə yaşdadır",ageTxt(d,t))+row("Heyvan ili",animal(d))+row("Pul vahidi",cur(c,y));
if(fs)s+=row("Bu ölkədə məşhur mahnı",esc(fs));if(fm)s+=row("Bu ölkədə məşhur film",esc(fm));
if(hf){p=hf.split("|");s+=row("Dünyada məşhur mahnı (ABŞ çartı)",esc(p[0]))+row("Dünyada məşhur film (ABŞ kassası)",esc(p[1]))};
return s}
var fam=[],born,tick;$("pc").innerHTML=$("fc").innerHTML=$("ct").innerHTML;
function renderFam(){$("fl").innerHTML=fam.map(function(f,i){return '<div class="item"><span>'+esc(f.r)+(f.n?': '+esc(f.n):'')+' · '+f.b.split("-").reverse().join(".")+'</span><button class="alt" data-i="'+i+'" aria-label="Sil">✕</button></div>'}).join("");
var bs=$("fl").querySelectorAll("button");for(var i=0;i<bs.length;i++)bs[i].onclick=function(){fam.splice(+this.getAttribute("data-i"),1);renderFam();save();if(!$("out").classList.contains("hide"))build()}}
function tog(p,b,show){var on=show===undefined?$(p).classList.contains("hide"):show;$(p).classList.toggle("hide",!on);$(b).classList.toggle("on",on)}
$("bp").onclick=function(){tog("pp","bp")};$("bf").onclick=function(){tog("fp","bf")};
$("fa").onclick=function(){var d=rd("fd");if(!d){alert("Ailə üzvünün doğum tarixini düzgün yaz: gün, ay, il.");return}
fam.push({c:$("fc").value,r:$("fr").value,n:$("fn").value.trim(),b:iso(d)});$("fn").value="";setD("fd","");renderFam();save();if(!$("out").classList.contains("hide"))build()};

function save(){try{localStorage.setItem("omur2",JSON.stringify({n:$("nm").value,b:rd("bd")?iso(rd("bd")):"",t:$("tg").value,c:$("ct").value,pc:$("pc").value,pn:$("pn").value,pb:rd("pb")?iso(rd("pb")):"",ps:rd("ps")?iso(rd("ps")):"",f:fam}))}catch(e){}}

function build(){
 var nm=esc($("nm").value.trim()||"Sən"),bd=rd("bd");
 if(!bd){alert("Doğum tarixini düzgün yaz: gün, ay, il.");return}
 born=bd;var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);
 if(days(born,today)<0){alert("Doğum tarixi gələcəkdə ola bilməz.");return}
 var tgt=Math.min(150,Math.max(1,parseInt($("tg").value)||100));
 var lived=days(born,today),h="";
 h+='<div class="hero"><div class="n" id="sec"></div><div class="l">saniyədir yaşayırsan'+(nm!=="Sən"?", "+nm:"")+'</div></div>';
 h+=row("Yaşın",ageTxt(born,today))+row("Yaşadığın gün",nf(lived))+row("Yaşadığın saat",'<span id="hr" style="color:inherit"></span>')+row("Doğulduğun gün",fmt(born))+row("Bürcün",burc(born))+row("Doğum ayının gülü",GUL[born.getMonth()]);
 var nb=nextOcc(born,today),age=nb.getFullYear()-born.getFullYear();
 h+='<h2>Növbəti ad günü</h2>'+row(age+" yaşın",when(nb,today));
 var ht=new Date(born.getFullYear()+tgt,born.getMonth(),born.getDate(),12),left=days(today,ht);
 h+='<h2>'+tgt+' yaş</h2>'+row(tgt+' yaşın dolacağı il',ht.getFullYear())+row("Dəqiq tarix",fmt(ht))+row("Qalan gün",left>0?nf(left)+" ("+Math.floor(left/365.25)+" il)":"artıq çatdın 🎉")+row("Yolun neçə faizi geridə",Math.min(100,lived/(tgt*365.25)*100).toFixed(1)+"%");
 h+='<h2>Gözəl rəqəmlər</h2>';
 [10000,15000,20000,25000,30000].forEach(function(n){var d=add(born,n);h+=row(nf(n)+"-cü gün",days(today,d)<0?"keçib ✓":fmt(d))});
 var b1=new Date(born.getFullYear(),born.getMonth(),born.getDate(),0,0,0).getTime()+1e12;
 h+=row("1 milyardıncı saniyə",b1<now.getTime()?"keçib ✓":fmt(new Date(b1)));
 h+='<h2>'+born.getFullYear()+' ilində dünya</h2>'+yb(born,$("ct").value,today);
 var ps=rd("ps"),pb=rd("pb"),pn=esc($("pn").value.trim()||"Sevgilim");
 if(ps||pb){
  h+='<h2>Sevgilim</h2>';
  if(ps){var dd=days(ps,today);
   if(dd<0)h+=note("Sevgili olma tarixi gələcəkdədir, yoxla.");
   else{var na=nextOcc(ps,today),yr=na.getFullYear()-ps.getFullYear();
    h+=row("Sevgilisiniz",ageTxt(ps,today))+row("Birlikdə gün",nf(dd))+row("Sevgili olduğunuz gün",fmt(ps))+row(yr+"-ci il dönümü",when(na,today));
    var ms=[100,365,500,1000,1500,2000,3000,5000],nx=ms.filter(function(n){return n>dd})[0];
    if(nx)h+=row("Növbəti gözəl rəqəm",nx+"-cü gün: "+fmt(add(ps,nx)));
    h+=row("Tanış olanda yaşın",ymd(born,ps)[0]);}}
  if(pb){var pnb=nextOcc(pb,today),pa=pnb.getFullYear()-pb.getFullYear(),pd=days(pb,today);
   h+=row(pn+" doğulub",fmt(pb))+row(pn+": "+pa+" yaşı",when(pnb,today))+row("Bürcü",burc(pb))+row("Doğum ayının gülü",GUL[pb.getMonth()]);h+=yb(pb,$("pc").value,today);
   h+='<h3>Ortaq nöqtələr</h3>';
   var diff=Math.abs(days(born,pb));
   h+=row("Yaş fərqi",nf(diff)+" gün ("+(diff/365.25).toFixed(1)+" il)")+row("Ortaq yaşınız",nf(lived+pd)+" gün");
   var rem=Math.ceil((36525-lived-pd)/2);
   if(rem>0)h+=row("Ortaq yaşınız 100 il olur",fmt(add(today,rem)));
   if(born.getMonth()===pb.getMonth())h+=note("İkiniz də "+AY[pb.getMonth()]+" ayında doğulmusunuz. Ortaq gülünüz: <b>"+GUL[pb.getMonth()]+"</b> 🌸");
   else h+=note("Sənin gülün <b>"+GUL[born.getMonth()]+"</b>, onun gülü <b>"+GUL[pb.getMonth()]+"</b>. Ad günlərində bir buket birləşdirə bilərsiniz 💐");
   if(burc(born)===burc(pb))h+=note("Eyni bürcdənsiniz: "+burc(born)+" ✨");
   if(born.getDay()===pb.getDay())h+=note("İkiniz də "+HG[born.getDay()]+" günü doğulmusunuz.");
   if(diff===0)h+=note("Eyni gün doğulmusunuz, nadir təsadüfdür! 🎂");
   if(born.getDate()===pb.getDate()&&born.getMonth()!==pb.getMonth())h+=note("Ad günləriniz ayın eyni günündədir: "+born.getDate()+".");
   if(ps){var dA=Math.abs(days(nextOcc(born,ps),ps)),dB=Math.abs(days(nextOcc(pb,ps),ps));
    h+=row("Sevgili olduğunuz gün ilə ad günlərin məsafəsi","sənin: "+Math.min(dA,365-dA)+" gün, onun: "+Math.min(dB,365-dB)+" gün");
    if(Math.min(dA,365-dA)<=7||Math.min(dB,365-dB)<=7)h+=note("Sevgili olduğunuz gün ad günlərinizdən birinə bir həftə qədər yaxındır 💞")}}
 }
 if(fam.length){h+='<h2>Ailə</h2>';
  fam.forEach(function(f){var b=P(f.b),fnb=nextOcc(b,today),fa=fnb.getFullYear()-b.getFullYear(),df=days(born,b);
   h+='<h3>'+esc(f.r)+(f.n?' · '+esc(f.n):'')+'</h3>'+row("Yaşı",ageTxt(b,today))+row(fa+" yaşı",when(fnb,today))+row("Bürcü",burc(b))+row("Səninlə fərq",(Math.abs(df)/365.25).toFixed(1)+" il, "+(df<0?"səndən böyükdür":df>0?"səndən kiçikdir":"eyni gündə doğulmusunuz 🎂"));
   h+=yb(b,f.c||"az",today);
   if(b.getMonth()===born.getMonth())h+=note("Sizin doğum ayınız eynidir: "+AY[b.getMonth()]+" 🌸");
   if(burc(b)===burc(born))h+=note("Eyni bürcdənsiniz: "+burc(b)+" ✨")})}
 $("out").innerHTML=h;$("out").classList.remove("hide");save();
 clearInterval(tick);upd();tick=setInterval(upd,1000);
 $("out").scrollIntoView({behavior:"smooth"});
}
function upd(){var st=new Date(born.getFullYear(),born.getMonth(),born.getDate(),0,0,0),s=Math.floor((Date.now()-st.getTime())/1000);
 $("sec").textContent=nf(s);$("hr").textContent=nf(Math.floor(s/3600))}
$("go").onclick=build;
$("clr").onclick=function(){["nm","pn","fn"].forEach(function(i){$(i).value=""});["bd","pb","ps","fd"].forEach(function(i){setD(i,"")});$("tg").value=100;fam=[];renderFam();clearInterval(tick);$("out").classList.add("hide");try{localStorage.removeItem("omur2")}catch(e){}};
try{var sv=JSON.parse(localStorage.getItem("omur2")||"null");if(sv){$("nm").value=sv.n||"";setD("bd",sv.b);$("tg").value=sv.t||100;$("ct").value=sv.c||"az";$("pc").value=sv.pc||"az";$("pn").value=sv.pn||"";setD("pb",sv.pb);setD("ps",sv.ps);fam=sv.f||[];renderFam();
if(sv.pb||sv.ps||sv.pn)tog("pp","bp",true);if(fam.length)tog("fp","bf",true);if(sv.b)build()}}catch(e){}
</script>
